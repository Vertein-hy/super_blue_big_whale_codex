<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鲸 · Codex 桌宠预览</title>
<style>
:root{color-scheme:light;--ink:#262747;--muted:#6f7186;--border:#e4e3ee;--accent:#555db1;--paper:#f7f7fc}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:48px 32px 32px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.14em;font-weight:700}h1{font-size:36px;line-height:1.3;margin:10px 0 12px;letter-spacing:-.03em}.subtitle{color:var(--muted);max-width:820px;margin:0 0 26px}
.toolbar{background:white;border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.tabs{display:flex;gap:4px;border-radius:11px;background:#f1f1f8;padding:4px}button,select{font:inherit;border-radius:8px;border:1px solid var(--border);background:white;color:var(--ink);padding:8px 13px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #969ee6;outline-offset:3px}.tabs button{border:0;background:transparent}.tabs button[aria-pressed=true]{background:var(--accent);color:white}.label{font-size:12px;color:var(--muted);margin-right:6px}#background{margin-left:auto}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:24px 0}.card{background:white;border:1px solid var(--border);border-radius:20px;overflow:hidden}.card-top{padding:18px 22px 8px;display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;border-radius:20px;padding:3px 9px;background:#f2f1fa;color:var(--accent)}h2{font-size:17px;margin:0}.stage{height:340px;display:flex;align-items:center;justify-content:center;margin:8px 14px 0;border-radius:14px;transition:background .15s}.stage.checker{background-color:#f9f9fc;background-image:linear-gradient(45deg,#eeeef6 25%,transparent 25%),linear-gradient(-45deg,#eeeef6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eeeef6 75%),linear-gradient(-45deg,transparent 75%,#eeeef6 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage.light{background:#fff}.stage.dark{background:#242638}canvas{display:block;width:256px;height:278px;max-width:100%;object-fit:contain;cursor:pointer}.card-bottom{padding:14px 22px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.player{display:flex;gap:14px;align-items:center;background:white;border:1px solid var(--border);padding:16px 18px;border-radius:15px}.player input{flex:1;min-width:60px;accent-color:var(--accent)}#frame-info{min-width:92px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}#play{min-width:88px;background:var(--accent);color:white;border-color:var(--accent)}.note{border-left:3px solid #b8b8db;padding:0 0 0 15px;margin:24px 2px;color:var(--muted);font-size:13px}.footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;margin-top:26px}.footer a{color:var(--accent);text-decoration:none}#status{font-size:12px;color:var(--muted);margin-top:12px;min-height:20px}#error{color:#9b2941;background:#fff0f2;border:1px solid #efc5d0;padding:12px;border-radius:10px;margin:20px 0}#error[hidden]{display:none}@media(max-width:900px){.cards{grid-template-columns:1fr}.stage{height:300px}main{padding:28px 18px}h1{font-size:29px}#background{margin-left:0}.footer{flex-direction:column}.card-top{padding-top:14px}.player{gap:8px;flex-wrap:wrap}.player input{min-width:120px}}
</style>
</head>
<body><main>
<div class="eyebrow">WHALE COMPANION / LOCAL PREVIEW</div>
<h1>小鲸，今天也陪你写代码。</h1>
<p class="subtitle">同一个蓝发鲸尾女孩，三套软萌装扮。这里可以对照查看 Codex 原生状态与完整 24 帧动作；页面离线运行，不读取项目、不连接会话。</p>
<div class="toolbar">
<div class="tabs" role="group" aria-label="预览格式"><button data-mode="native" aria-pressed="true">Codex 原生版</button><button data-mode="source" aria-pressed="false">完整 24 帧</button></div>
<label><span class="label">动作</span><select id="action" aria-label="选择动作"></select></label>
<label><span class="label">速度</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
<button id="background" title="切换透明背景的展示方式">背景：棋盘</button>
</div>
<div id="error" role="alert" hidden></div><section class="cards" id="cards" aria-label="三套装扮"></section>
<div class="player"><button id="play">暂停</button><button id="step" title="暂停并前进一帧">下一帧</button><input id="scrub" type="range" min="0" max="5" value="0" aria-label="逐帧查看"><span id="frame-info">01 / 06 帧</span></div>
<div id="status" role="status"></div><div class="note" id="note"></div>
<div class="footer"><span>透明 WebP · 原生 V1 兼容图集 · 3 套装扮 / 27 组原始动作</span><span><a href="README.md">安装说明</a> · <a href="docs/COMPATIBILITY.md">兼容性与限制</a></span></div>
</main><script src="preview-data.js"></script><script src="preview.js"></script></body></html>
